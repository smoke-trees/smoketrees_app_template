name: {{project_name}}
description: {{description}}
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  get:
  shimmer: ^3.0.0
  dio: 5.10.0
  hive_flutter:
  hive:
  pretty_dio_logger:
  dio_cache_interceptor:
  google_fonts: 6.1.0
  flutter_svg: 2.2.3

  cupertino_icons: ^1.0.8
  toastification: ^3.0.3
  fluttertoast: ^9.0.0
  dropdown_button2: 2.3.9
  smart_auth: 2.0.0
  pinput:
  scroll_date_picker: ^3.8.0
  lottie: ^3.3.2
  package_info_plus: ^9.0.1
  device_info_plus: ^12.4.0
  connectivity_plus: ^7.1.0
  version: ^3.0.2
  app_links: ^6.4.1
{% if include_firebase %}
  firebase_messaging: ^16.1.3
  flutter_local_notifications: ^19.0.0
{% endif %}
  share_plus: ^12.0.2
  url_launcher: ^6.3.2
  dartx: ^1.2.0
  image_picker: ^1.2.1
  intl: ^0.20.2
  webview_flutter: ^4.13.1
  flutter_cache_manager: ^3.4.1
  cached_network_image: ^3.4.1
  permission_handler: ^12.0.1
  auto_size_text: ^3.0.0
  flutter_html: ^3.0.0
  json_class: ^3.0.1
  stac:
    git:
      url: https://github.com/smoke-trees/st_sdui.git
      ref: main
      path: packages/stac
  json_annotation: ^4.9.0

dependency_overrides:
  stac_core:
    git:
      url: https://github.com/smoke-trees/st_sdui.git
      ref: main
      path: packages/stac_core

  stac_framework:
    git:
      url: https://github.com/smoke-trees/st_sdui.git
      ref: main
      path: packages/stac_framework

  stac_logger:
    git:
      url: https://github.com/smoke-trees/st_sdui.git
      ref: main
      path: packages/stac_logger

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable:
  hive_generator:
  build_runner:

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/svgs/
    - assets/svgs/tabs/
    - assets/images/
    - assets/lotties/